name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Drone.Agent/**"
      - "Drone.Core/**"
      - "Drone.System/**"
      - "Drone.Services/**"
      - "Drone.MCP/**"
      - "Drone.Autonomy/**"
      - "Dockerfile"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin ${{ secrets.ACR_SERVER }}
          docker build -t ${{ secrets.ACR_SERVER }}/velocity-drone:latest .
          docker push ${{ secrets.ACR_SERVER }}/velocity-drone:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/velocity
            docker compose pull drone || true
            docker compose up -d drone || echo "Drone service not yet in compose"
