name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Drone.Agent/**"
      - "Drone.Core/**"
      - "Drone.System/**"
      - "Drone.Services/**"
      - "Drone.MCP/**"
      - "Drone.Autonomy/**"
      - "Drone.Custody/**"
      - "Dockerfile"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 Preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore VelocityDrone.slnx

      - name: Build
        run: dotnet build VelocityDrone.slnx --no-restore -c Release /p:SkipRust=true

      - name: Test
        run: dotnet test tests/Drone.Tests/Drone.Tests.csproj --no-build -c Release --verbosity normal

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin ${{ secrets.ACR_SERVER }}
          docker build -t ${{ secrets.ACR_SERVER }}/velocity-drone:latest .
          docker push ${{ secrets.ACR_SERVER }}/velocity-drone:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/velocity
            docker compose pull drone || true
            docker compose up -d drone || echo "Drone service not yet in compose"
